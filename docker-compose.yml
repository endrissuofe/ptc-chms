# Local development stack: app + MongoDB Community + Mongo Express
# Start everything:   docker compose up
# Database only:      docker compose up -d mongo mongo-express  (then run `npm run dev` on your machine)

services:
  mongo:
    image: mongo:7.0
    container_name: ptc-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-root}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ptc_chms}
      MONGO_APP_USER: ${MONGO_APP_USER:-ptc_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-change-me-app}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ptc-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-change-me-root}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-change-me-express}
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build:
      context: .
      target: dev
    container_name: ptc-app
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:-ptc_app}:${MONGO_APP_PASSWORD:-change-me-app}@mongo:27017/${MONGO_DB:-ptc_chms}?authSource=${MONGO_DB:-ptc_chms}
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mongo:
        condition: service_healthy

  backup:
    image: mongo:7.0
    container_name: ptc-backup
    profiles: ['backup']
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-change-me-root}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-ptc_chms}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - mongo-backups:/backups
    entrypoint: ['bash', '/backup.sh']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  mongo-backups:
